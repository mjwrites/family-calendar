<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Calendar</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-inner-bg: rgba(15, 23, 42, 0.4);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      height: 75px;
    }
    .clock-group { display: flex; align-items: baseline; gap: 12px; }
    #clock { font-size: 2.6rem; font-weight: 700; letter-spacing: -1px; }
    #ampm { font-size: 1.2rem; color: var(--text-muted); font-weight: 600; }
    #date-display { font-size: 1.35rem; color: var(--accent); font-weight: 500; }
    .filters { display: flex; gap: 10px; }
    .pill {
      padding: 7px 16px;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      opacity: 0.45;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }
    .pill.active { opacity: 1; transform: scale(1.05); }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 16px;
      padding: 16px 24px;
      height: calc(100vh - 75px);
      overflow: hidden;
    }

    .today-panel {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100%;
    }
    .panel-header {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .today-events {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .today-events::-webkit-scrollbar { display: none; }

    .upcoming-container {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 12px;
      height: 100%;
      overflow: hidden;
    }

    .day-card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }
    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .day-title-group {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .day-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
    }
    .day-date {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
    }
    .tomorrow-badge {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }
    .day-events {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .day-events::-webkit-scrollbar { display: none; }

    /* Base event card */
    .event-card {
      color: #fff;
      display: flex;
      flex-direction: column;
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    .event-card.current {
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.35);
      border: 2px solid #fff;
    }
    .event-card.current::after {
      content: 'NOW';
      position: absolute;
      right: 12px;
      top: 10px;
      background: rgba(0, 0, 0, 0.55);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    /* Today's Schedule events: prominent, spacious & legible from across the kitchen */
    .today-panel .event-card {
      padding: 18px 22px;
      border-radius: 14px;
      gap: 6px;
    }
    .today-panel .event-time {
      font-size: 1.05rem;
      font-weight: 600;
      opacity: 0.95;
    }
    .today-panel .event-title {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.25;
    }
    .today-panel .event-loc {
      font-size: 0.9rem;
      opacity: 0.85;
      margin-top: 2px;
    }

    /* 6-Day Preview Grid events: compact to fit neatly within 2x3 grid cells */
    .day-card .event-card {
      padding: 8px 12px;
      border-radius: 8px;
      gap: 2px;
    }
    .day-card .event-time {
      font-size: 0.78rem;
      font-weight: 600;
      opacity: 0.9;
    }
    .day-card .event-title {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .day-card .event-loc {
      font-size: 0.75rem;
      opacity: 0.8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .no-events {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(148, 163, 184, 0.4);
      font-size: 0.88rem;
      font-style: italic;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 1.15rem;
      text-align: center;
      gap: 8px;
    }
    .empty-state-icon {
      font-size: 2.2rem;
      opacity: 0.6;
    }

    @media (max-width: 900px) {
      body { height: auto; overflow: auto; }
      main {
        grid-template-columns: 1fr;
        height: auto;
        overflow: visible;
      }
      .upcoming-container {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        height: auto;
        overflow: visible;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="clock-group">
      <div id="clock">12:00</div>
      <div id="ampm">PM</div>
      <div id="date-display">Loading...</div>
    </div>
    <div class="filters" id="filter-pills"></div>
  </header>
  <main>
    <section class="today-panel">
      <div class="panel-header">Today's Schedule</div>
      <div class="today-events" id="today-events"></div>
    </section>
    <section class="upcoming-container" id="upcoming-container">
    </section>
  </main>
  <script>
    const TIMEZONE = 'America/Los_Angeles';
    const CALENDARS = [
      { id: 'all', name: 'All', color: '#475569' },
      { id: 'anna_mj', name: 'Anna & MJ', color: '#3f51b5' },
      { id: 'anna', name: 'Anna', color: '#ab47bc' },
      { id: 'boys', name: 'Boys', color: '#f57c00' },
      { id: 'mj', name: 'MJ', color: '#00897b' }
    ];
    let selectedCal = 'all';
    let cachedEvents = [];

    function updateClock() {
      const now = new Date();
      const timeParts = new Intl.DateTimeFormat('en-US', {
        timeZone: TIMEZONE,
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      }).formatToParts(now);

      const hour = timeParts.find(p => p.type === 'hour').value;
      const minute = timeParts.find(p => p.type === 'minute').value;
      const dayPeriod = timeParts.find(p => p.type === 'dayPeriod');
      const ampm = dayPeriod ? dayPeriod.value : '';

      document.getElementById('clock').textContent = `${hour}:${minute}`;
      document.getElementById('ampm').textContent = ampm;
      document.getElementById('date-display').textContent = now.toLocaleDateString('en-US', {
        timeZone: TIMEZONE,
        weekday: 'long',
        month: 'short',
        day: 'numeric'
      });
    }

    function renderPills() {
      const container = document.getElementById('filter-pills');
      container.innerHTML = '';
      CALENDARS.forEach(cal => {
        const btn = document.createElement('div');
        btn.className = `pill ${selectedCal === cal.id ? 'active' : ''}`;
        btn.textContent = cal.name;
        btn.style.backgroundColor = cal.color;
        btn.style.color = '#fff';
        btn.onclick = () => { selectedCal = cal.id; renderPills(); renderEvents(); };
        container.appendChild(btn);
      });
    }

    function getDayString(d) {
      return d.toLocaleDateString('en-CA', { timeZone: TIMEZONE });
    }

    function getDaysAhead(startDate, daysAhead) {
      const parts = new Intl.DateTimeFormat('en-US', {
        timeZone: TIMEZONE,
        year: 'numeric',
        month: 'numeric',
        day: 'numeric'
      }).formatToParts(startDate);
      const year = parseInt(parts.find(p => p.type === 'year').value, 10);
      const month = parseInt(parts.find(p => p.type === 'month').value, 10) - 1;
      const day = parseInt(parts.find(p => p.type === 'day').value, 10);

      return new Date(Date.UTC(year, month, day + daysAhead, 12, 0, 0));
    }

    function renderEvents() {
      const now = new Date();
      const todayStr = getDayString(now);

      const filtered = cachedEvents.filter(e => selectedCal === 'all' || e.calendarId === selectedCal);
      const todayList = [];
      const eventsByDay = new Map();

      filtered.forEach(e => {
        const start = new Date(e.start);
        const end = new Date(e.end);
        const eventDay = getDayString(start);
        if (eventDay === todayStr || (start <= now && end > now)) {
          todayList.push(e);
        } else {
          if (!eventsByDay.has(eventDay)) {
            eventsByDay.set(eventDay, []);
          }
          eventsByDay.get(eventDay).push(e);
        }
      });

      todayList.sort((a, b) => new Date(a.start) - new Date(b.start));

      renderTodayList(todayList);
      render6DaysGrid(eventsByDay, now);
    }

    function renderTodayList(events) {
      const container = document.getElementById('today-events');
      container.innerHTML = '';
      if (!events.length) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">✨</div>
            <div>All clear for today!</div>
          </div>`;
        return;
      }
      const now = new Date();
      events.forEach(e => {
        container.appendChild(createEventCard(e, now, true));
      });
    }

    function render6DaysGrid(eventsByDay, now) {
      const container = document.getElementById('upcoming-container');
      container.innerHTML = '';

      for (let i = 1; i <= 6; i++) {
        const dayDate = getDaysAhead(now, i);
        const dayKey = getDayString(dayDate);
        const dayEvents = eventsByDay.get(dayKey) || [];
        dayEvents.sort((a, b) => new Date(a.start) - new Date(b.start));

        const dayCard = document.createElement('div');
        dayCard.className = 'day-card';

        const isTomorrow = (i === 1);
        const weekdayName = dayDate.toLocaleDateString('en-US', { timeZone: TIMEZONE, weekday: 'long' });
        const monthDay = dayDate.toLocaleDateString('en-US', { timeZone: TIMEZONE, month: 'short', day: 'numeric' });

        dayCard.innerHTML = `
          <div class="day-header">
            <div class="day-title-group">
              <span class="day-name">${weekdayName}</span>
              <span class="day-date">${monthDay}</span>
            </div>
            ${isTomorrow ? '<span class="tomorrow-badge">Tomorrow</span>' : ''}
          </div>
          <div class="day-events"></div>
        `;

        const eventsContainer = dayCard.querySelector('.day-events');
        if (dayEvents.length > 0) {
          dayEvents.forEach(e => {
            eventsContainer.appendChild(createEventCard(e, now, false));
          });
        } else {
          eventsContainer.innerHTML = '<div class="no-events">No events</div>';
        }

        container.appendChild(dayCard);
      }
    }

    function createEventCard(e, now, checkCurrent) {
      const start = new Date(e.start);
      const end = new Date(e.end);
      const isCurrent = checkCurrent && (now >= start && now < end);
      const card = document.createElement('div');
      card.className = `event-card ${isCurrent ? 'current' : ''}`;
      card.style.backgroundColor = e.color;

      const timeStr = e.allDay ? 'All Day' : `${formatTime(start)} - ${formatTime(end)}`;
      const cleanTitle = (e.title || '').replace(/\\,/g, ',');
      const cleanLoc = (e.location || '').replace(/\\,/g, ',');

      card.innerHTML = `
        <div class="event-time">${timeStr} · ${e.calendarName}</div>
        <div class="event-title">${cleanTitle}</div>
        ${cleanLoc ? `<div class="event-loc">📍 ${cleanLoc}</div>` : ''}
      `;
      return card;
    }

    function formatTime(d) {
      return d.toLocaleTimeString('en-US', {
        timeZone: TIMEZONE,
        hour: 'numeric',
        minute: '2-digit'
      });
    }

    const EVENTS_API_URL = 'https://script.google.com/macros/s/AKfycbwq-Yzjxyu5gbaoM4iT7qwHX8wdcJ6X77UsXPtr0X1LLn7A6C86RkOzAvqOevqceyQ0/exec';

    async function fetchEvents() {
      try {
        const resp = await fetch(EVENTS_API_URL, { redirect: 'follow' });
        if (resp.ok) {
          cachedEvents = await resp.json();
          renderEvents();
          return;
        }
      } catch (err) {
        console.warn('Live API fetch failed, trying fallback:', err);
      }

      try {
        const fallbackResp = await fetch('events.json?t=' + Date.now());
        if (fallbackResp.ok) {
          cachedEvents = await fallbackResp.json();
          renderEvents();
        }
      } catch (e) {
        console.error('All event fetches failed:', e);
      }
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
      } catch(e) {}
    }

    setInterval(updateClock, 1000);
    setInterval(fetchEvents, 60000);

    // Auto-reload webpage when new GitHub Pages commit deploys
    async function checkForPageUpdate() {
      try {
        const resp = await fetch(window.location.href, { method: 'HEAD', cache: 'no-cache' });
        const etag = resp.headers.get('etag') || resp.headers.get('last-modified');
        if (window._pageEtag && etag && window._pageEtag !== etag) {
          console.log('New deployment detected, reloading page...');
          window.location.reload();
        }
        if (etag) window._pageEtag = etag;
      } catch (e) {}
    }
    setInterval(checkForPageUpdate, 120000);
    checkForPageUpdate();

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });

    updateClock();
    renderPills();
    fetchEvents();
    requestWakeLock();

    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(JSON.stringify({type: 'REMOTE_WINDOW', status: 'LOADED'}), '*');
      }
    } catch (e) {}
  </script>
</body>
</html>
