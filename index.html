<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Calendar</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 28px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }
    .clock-group { display: flex; align-items: baseline; gap: 12px; }
    #clock { font-size: 2.8rem; font-weight: 700; letter-spacing: -1px; }
    #ampm { font-size: 1.3rem; color: var(--text-muted); font-weight: 600; }
    #date-display { font-size: 1.4rem; color: #38bdf8; font-weight: 500; }
    .filters { display: flex; gap: 10px; }
    .pill {
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      opacity: 0.45;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }
    .pill.active { opacity: 1; transform: scale(1.05); }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1.3fr 0.9fr;
      gap: 20px;
      padding: 20px 28px;
      height: calc(100vh - 85px);
    }
    .panel {
      background: var(--card-bg);
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .event-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .event-list::-webkit-scrollbar { display: none; }
    .event-card {
      padding: 14px 18px;
      border-radius: 12px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }
    .event-card.current {
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.25);
      border: 2px solid #fff;
    }
    .event-card.current::after {
      content: 'NOW';
      position: absolute;
      right: 14px;
      top: 14px;
      background: rgba(0,0,0,0.5);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
    }
    .event-time { font-size: 0.95rem; font-weight: 600; opacity: 0.9; }
    .event-title { font-size: 1.2rem; font-weight: 700; }
    .event-loc { font-size: 0.85rem; opacity: 0.8; }
    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="clock-group">
      <div id="clock">12:00</div>
      <div id="ampm">PM</div>
      <div id="date-display">Monday, Oct 26</div>
    </div>
    <div class="filters" id="filter-pills"></div>
  </header>
  <main>
    <section class="panel">
      <div class="panel-header">Today's Schedule</div>
      <div class="event-list" id="today-events"></div>
    </section>
    <section class="panel">
      <div class="panel-header">Upcoming (Next 3 Days)</div>
      <div class="event-list" id="upcoming-events"></div>
    </section>
  </main>
  <script>
    const CALENDARS = [
      { id: 'all', name: 'All', color: '#475569' },
      { id: 'anna_mj', name: 'Anna & MJ', color: '#3f51b5' },
      { id: 'anna', name: 'Anna', color: '#ab47bc' },
      { id: 'boys', name: 'Boys', color: '#f57c00' },
      { id: 'mj', name: 'MJ', color: '#00897b' }
    ];
    let selectedCal = 'all';
    let cachedEvents = [];

    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const mins = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      document.getElementById('clock').textContent = `${hours}:${mins}`;
      document.getElementById('ampm').textContent = ampm;
      document.getElementById('date-display').textContent = now.toLocaleDateString('en-US', {
        weekday: 'long', month: 'short', day: 'numeric'
      });
    }

    function renderPills() {
      const container = document.getElementById('filter-pills');
      container.innerHTML = '';
      CALENDARS.forEach(cal => {
        const btn = document.createElement('div');
        btn.className = `pill ${selectedCal === cal.id ? 'active' : ''}`;
        btn.textContent = cal.name;
        btn.style.backgroundColor = cal.color;
        btn.style.color = '#fff';
        btn.onclick = () => { selectedCal = cal.id; renderPills(); renderEvents(); };
        container.appendChild(btn);
      });
    }

    function renderEvents() {
      const now = new Date();
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const todayEnd = new Date(todayStart.getTime() + 86400000);
      const upcomingEnd = new Date(todayStart.getTime() + (86400000 * 4));

      const filtered = cachedEvents.filter(e => selectedCal === 'all' || e.calendarId === selectedCal);
      const todayList = [];
      const upcomingList = [];

      filtered.forEach(e => {
        const start = new Date(e.start);
        const end = new Date(e.end);
        if (start < todayEnd && end > todayStart) todayList.push(e);
        else if (start >= todayEnd && start < upcomingEnd) upcomingList.push(e);
      });

      renderList('today-events', todayList, true);
      renderList('upcoming-events', upcomingList, false);
    }

    function renderList(elemId, events, checkCurrent) {
      const container = document.getElementById(elemId);
      container.innerHTML = '';
      if (!events.length) {
        container.innerHTML = '<div class="empty-state">No events scheduled</div>';
        return;
      }
      const now = new Date();
      events.forEach(e => {
        const start = new Date(e.start);
        const end = new Date(e.end);
        const isCurrent = checkCurrent && (now >= start && now < end);
        const card = document.createElement('div');
        card.className = `event-card ${isCurrent ? 'current' : ''}`;
        card.style.backgroundColor = e.color;

        let timeStr = e.allDay ? 'All Day' : `${formatTime(start)} - ${formatTime(end)}`;
        if (!checkCurrent) {
          timeStr = `${start.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' })} · ${timeStr}`;
        }

        card.innerHTML = `
          <div class="event-time">${timeStr} · ${e.calendarName}</div>
          <div class="event-title">${e.title}</div>
          ${e.location ? `<div class="event-loc">📍 ${e.location}</div>` : ''}
        `;
        container.appendChild(card);
      });
    }

    function formatTime(d) {
      let h = d.getHours();
      const m = String(d.getMinutes()).padStart(2, '0');
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${h}:${m} ${ampm}`;
    }

    async function fetchEvents() {
      try {
        const resp = await fetch('events.json?t=' + Date.now());
        if (resp.ok) { cachedEvents = await resp.json(); renderEvents(); }
      } catch (err) { console.error('Fetch failed:', err); }
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
      } catch(e) {}
    }

    setInterval(updateClock, 1000);
    setInterval(fetchEvents, 60000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });

    updateClock();
    renderPills();
    fetchEvents();
    requestWakeLock();
  </script>
</body>
</html>
